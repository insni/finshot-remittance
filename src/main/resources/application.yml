spring:
  application:
    name: remittance  # application name
  datasource:
    url: "jdbc:h2:mem:remittance;DB_CLOSE_DELAY=-1"  # in-memory H2 database URL
  sql:
    init:
      mode: always  # always run SQL init at startup
      schema-locations: classpath:schema.sql  # location of the schema SQL file
  h2:
    console:
      enabled: false  # H2 web console off
