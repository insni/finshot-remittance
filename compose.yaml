services:
  app:
    build: .
    ports:
      - "8080:8080"

  test:
    image: docker.io/library/eclipse-temurin:17.0.20_8-jdk
    profiles: [tools]  # skipped by up, run it with run only
    working_dir: /work
    volumes:
      - .:/work:z  # z allows access on SELinux hosts (Fedora etc.)
      - m2:/root/.m2  # keep the dependency cache
    command: ./mvnw -B test

  scenarios:
    image: docker.io/library/alpine:3.22
    profiles: [tools]  # skipped by up, run it with run only
    depends_on: [app]
    working_dir: /work
    volumes:
      - ./scripts:/work/scripts:ro,z  # scripts only, read-only (z is for SELinux)
    environment:
      BASE: http://app:8080  # reach the app by its service name inside the container
      SCRIPT: scenarios.sh  # script to run. For Part 2: run -e SCRIPT=scenarios-part2.sh
    # retry for up to 60 seconds until the app responds, then run the scenarios
    command:
      - sh
      - -c
      - |
        apk add -q --no-cache bash curl
        for i in $$(seq 60); do curl -s -o /dev/null $$BASE/ && break; sleep 1; done
        exec bash scripts/$$SCRIPT

volumes:
  m2:
